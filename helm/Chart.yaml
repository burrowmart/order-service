apiVersion: v2
name: order-service
description: >
  Order-service Helm chart. Declares base-service as a chart dependency so
  all Kubernetes object templates (Deployment, Service, Ingress, ExternalSecret,
  HPA, PDB, ServiceAccount, ConfigMap) are inherited without duplication.
  Only service-specific values live here.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - archtenet
  - microservice
  - order-service
maintainers:
  - name: platform-team
dependencies:
  - name: base-service
    version: "0.1.0"
    # Published by platform-infra's publish-base-chart workflow. CI resolves
    # it with `helm dependency update`; the downloaded tarball lands in
    # helm/charts/, which is gitignored because it is a build artifact.
    #
    # Locally there is no need to pull from the registry — run
    # platform-infra/scripts/vendor-base-chart.sh to package the sibling
    # checkout straight into helm/charts/ instead.
    repository: "oci://ghcr.io/burrowmart/charts"
